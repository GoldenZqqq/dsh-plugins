<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>dsh-heartbeat harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; color: #e6e8ee;
    font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  #panel { position: fixed; left: 16px; top: 16px; width: 460px; padding: 14px 16px;
    border: 0.5px solid #2a3140; border-radius: 12px; background: #141a23; }
  #panel h1 { margin: 0 0 8px; font-size: 14px; }
  #log { margin: 8px 0 0; padding: 0; list-style: none; font-family: ui-monospace, Consolas, monospace;
    font-size: 11.5px; max-height: 60vh; overflow: auto; }
  #log li { padding: 1px 0; }
  .ok { color: #3fb950; }
  .bad { color: #f85149; }
  .dim { color: #8b949e; }
</style>
</head>
<body>
<div id="panel">
  <h1>dsh-heartbeat · 无 DSH 测试台</h1>
  <div class="dim">假 ctx 挂载 client.js，按 0.2.x 的真实线格式（assistant-stream 帧）模拟吐字 / 出错 / 重试 / 断线。</div>
  <ul id="log"></ul>
</div>

<script>
  window.__ModuleLoader__ = {
    load(reg) { window.__hbReg = reg; },
  };
</script>
<script src="../client.js"></script>
<script>
(function () {
  'use strict';

  const logEl = document.getElementById('log');
  const results = [];
  window.__test = { results, done: false };

  /* 清掉上一轮的记忆，保证每次都是"首次安装"的默认形态。 */
  try { window.localStorage.clear(); } catch {}

  function log(msg, cls) {
    const li = document.createElement('li');
    if (cls) li.className = cls;
    li.textContent = msg;
    logEl.appendChild(li);
  }
  function check(name, pass, detail) {
    results.push({ name, pass, detail });
    log((pass ? '✓ ' : '✗ ') + name + (detail ? '  ' + detail : ''), pass ? 'ok' : 'bad');
  }
  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  /* ── 假 ctx ───────────────────────────────────────────────── */
  const stateSubs = new Set();
  let connectionState = 'connected';

  const listSnapshot = {
    ids: ['s1'],
    byId: { s1: { id: 's1', running: true, origin: undefined } },
  };

  const frameQueue = [];
  let wake = null;
  let revision = 0;
  let chunkIndex = 0;
  let liveRequested = false;

  function emitFrame(frame) {
    frameQueue.push(frame);
    if (wake) { const fn = wake; wake = null; fn(); }
  }
  function emitEvent(ev) { emitFrame({ type: 'event', event: ev }); }
  function emitChunk() {
    revision += 1;
    emitFrame({
      type: 'assistant-stream',
      frame: {
        type: 'chunk',
        attemptId: 'a1',
        revision,
        index: chunkIndex++,
        time: Date.now(),
        chunk: { type: 'text-delta' },
      },
    });
  }

  /* 打开时的 snapshot：带一条 durable 的 request/header，模型名就靠它补。 */
  function snapshotFrame() {
    return {
      type: 'snapshot',
      header: {},
      cursor: 12,
      records: [{
        type: 'event',
        event: {
          type: 'request/header',
          seq: 11,
          time: Date.now(),
          data: { header: { config: { provider: 'deepseek-official', model: 'deepseek-flash' } } },
        },
      }],
      hasMore: false,
      projections: {},
      assistantStream: { revision: 0, activeAttempt: undefined },
    };
  }

  const stream = {
    async *follow(request, signal) {
      /* 记录插件有没有显式请求 assistantStream —— 这是"不跳"的头号原因。 */
      liveRequested = request && request.assistantStream === true;
      yield snapshotFrame();
      while (!signal.aborted) {
        if (frameQueue.length === 0) {
          await new Promise((resolve) => {
            wake = resolve;
            setTimeout(resolve, 60);
          });
        }
        while (frameQueue.length > 0) {
          if (signal.aborted) return;
          const frame = frameQueue.shift();
          /* 没请求就不下发，完全复刻真实行为。 */
          if (frame.type === 'assistant-stream' && !liveRequested) continue;
          yield frame;
        }
      }
    },
  };

  let disposer = null;
  let declared = null;

  /*
   * 复刻 cordis 的嵌套服务守卫：没在 inject 里声明 "remote.session" 就读它，
   * 真实环境会抛 `cannot get property "remote.session" without inject`。
   * 这个坑让整块面板静默显示 0 过，所以测试台必须能重现它。
   */
  function guardedRemote(declaredNames) {
    return {
      get session() {
        if (declaredNames === null || !declaredNames.has('remote.session')) {
          throw new Error('cannot get property "remote.session" without inject');
        }
        return stream;
      },
    };
  }

  const ctx = {
    get(name) {
      if (name === 'connection') {
        return {
          state: {
            getSnapshot: () => connectionState,
            subscribe(fn) { stateSubs.add(fn); return () => stateSubs.delete(fn); },
          },
        };
      }
      if (name === 'sessions') {
        return {
          list: {
            getSnapshot: () => listSnapshot,
            subscribe() { return () => {}; },
          },
          subagentAddress: () => undefined,
        };
      }
      if (name === 'remote') return guardedRemote(declared);
      return undefined;
    },
    on() { return () => {}; },
    effect(fn) { disposer = fn(); },
  };

  /* ── 启动 ─────────────────────────────────────────────────── */
  const factory = window.__hbReg.factory;
  const plugin = factory(() => { throw new Error('client.js 不应该 require 任何模块'); });

  declared = new Set(Array.isArray(plugin.inject) ? plugin.inject : []);

  check('模块导出 apply/inject', typeof plugin.apply === 'function' && Array.isArray(plugin.inject),
    'inject = ' + JSON.stringify(plugin.inject));
  check('inject 不含 slots', plugin.inject.indexOf('slots') === -1);
  check('inject 声明了 remote.session', declared.has('remote.session'));

  plugin.apply(ctx, {});
  const host = document.getElementById('dsh-heartbeat');
  check('小组件挂载到 body', host !== null);
  check('默认卡片形态', host && host.dataset.mode === 'card');

  const metric = (i) => host.querySelectorAll('.hb-metric b')[i].textContent;

  (async function run() {
    await sleep(400);
    const bpm0 = Number(host.querySelector('.hb-bpm').textContent);
    /* 有会话在跑就是"思考"档（38–50），刚从 25 起步所以取 20–50 的并集。 */
    check('起步心率落在静息/思考区间', bpm0 >= 20 && bpm0 <= 50, 'bpm = ' + bpm0);

    check('follow 显式请求 assistantStream', liveRequested === true, 'assistantStream = ' + liveRequested);
    check('模型名由 snapshot 补齐（没等新事件）',
      host.querySelector('.hb-model').textContent.indexOf('deepseek') >= 0,
      'model = ' + host.querySelector('.hb-model').textContent);

    /* 2.6 秒吐字：走 assistant-stream 的 chunk 帧（真实路径） */
    emitFrame({ type: 'assistant-stream', frame: { type: 'start', attemptId: 'a1', revision: 0, startedAfterSeq: 11, turn: 1, step: 1 } });
    const burstTimer = setInterval(() => { emitChunk(); emitChunk(); emitChunk(); }, 25);

    await sleep(2600);
    clearInterval(burstTimer);

    const bpm1 = Number(host.querySelector('.hb-bpm').textContent);
    check('吐字后心率上升', bpm1 > 80, 'bpm = ' + bpm1 + ', rate = ' + metric(0) + ' tok/s');
    check('状态切到 streaming/burst', ['streaming', 'burst'].indexOf(host.dataset.state) >= 0, 'state = ' + host.dataset.state);
    check('TTFT 有值', metric(1) !== '—', 'ttft = ' + metric(1));
    check('tokens 在累加', Number(metric(2).replace('k', '')) > 0, 'tokens = ' + metric(2));

    /*
     * 波形极性：R 波必须向上。
     * 曾经因为减号写在了"上一项的行尾"，R 项被整体取负，整条心电图翻成 V 字，
     * 而当时所有断言（有像素、会动）依然全绿 —— 所以这里量的是振幅方向。
     */
    {
      const canvas = host.querySelector('canvas');
      const c2d = canvas.getContext('2d');
      const { width: cw, height: ch } = canvas;
      const px = c2d.getImageData(0, 0, cw, ch).data;
      let top = ch;
      let bottom = 0;
      for (let y = 0; y < ch; y += 1) {
        for (let x = 0; x < cw; x += 1) {
          const i = (y * cw + x) * 4;
          const r = px[i];
          const g = px[i + 1];
          const b = px[i + 2];
          const a = px[i + 3];
          /* 只认彩色像素：网格是低饱和灰，波形是状态色（绿/红）。 */
          if (a > 60 && Math.max(r, g, b) - Math.min(r, g, b) > 50) {
            if (y < top) top = y;
            if (y > bottom) bottom = y;
          }
        }
      }
      const mid = ch * 0.62;
      const up = mid - top;
      const down = bottom - mid;
      check('R 波向上（波形没有倒置成 V 字）',
        up > down * 1.4 && up > ch * 0.12,
        'up = ' + Math.round(up) + 'px, down = ' + Math.round(down) + 'px');
    }

    /* durable 的 assistant/live-chunk 事件也要兼容（部分版本 / 重放路径） */
    const before = Number(metric(2));
    emitEvent({ type: 'assistant/live-chunk', data: { chunk: { type: 'text-delta' } } });
    emitEvent({ type: 'tool/call', data: {} });
    await sleep(220);
    check('兼容 durable 的 live-chunk 事件', Number(metric(2)) > before, 'tokens ' + before + ' -> ' + metric(2));
    check('工具调用计数', metric(3) !== '0', 'tools = ' + metric(3));

    /* 出错 → 心律不齐 */
    emitEvent({ type: 'turn/end', data: { reason: { kind: 'error' } } });
    await sleep(500);
    check('出错 → 心律不齐', host.dataset.state === 'arrhythmia', 'state = ' + host.dataset.state);

    /* 重试 → 早搏 */
    await sleep(100);
    emitEvent({ type: 'llm/retry', data: {} });
    await sleep(200);
    check('重试 → 早搏', host.dataset.state === 'premature', 'state = ' + host.dataset.state);

    /* 审批等待 → 屏息 */
    emitEvent({ type: 'turn/end', data: { reason: { kind: 'blocked' } } });
    await sleep(200);
    check('等待审批 → 屏息', host.dataset.state === 'apnea', 'state = ' + host.dataset.state);

    /* ECG 有像素被画出来 */
    const canvas = host.querySelector('canvas');
    const c2d = canvas.getContext('2d');
    const pixels = c2d.getImageData(0, 0, canvas.width, canvas.height).data;
    let painted = 0;
    for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 8) painted += 1;
    check('ECG 画布有内容', painted > 500, painted + ' 个不透明像素');

    /* 迷你条切换 */
    host.querySelectorAll('.hb-menu button')[0].click();
    await sleep(120);
    check('可切到迷你条', host.dataset.mode === 'rail', 'mode = ' + host.dataset.mode);
    check('迷你条显示 BPM', /^\d+$/.test(host.querySelector('.hb-rail-bpm').textContent),
      'rail bpm = ' + host.querySelector('.hb-rail-bpm').textContent);

    /* 断线 */
    connectionState = 'offline';
    stateSubs.forEach((fn) => fn('offline'));
    await sleep(300);
    check('断线 → 离线状态', host.dataset.state === 'disconnected', 'state = ' + host.dataset.state);

    /* 卸载 */
    if (typeof disposer === 'function') disposer();
    await sleep(120);
    check('卸载后 DOM 已清理', document.getElementById('dsh-heartbeat') === null);

    window.__test.done = true;
    const failed = results.filter((r) => !r.pass).length;
    log(failed === 0 ? '全部通过（' + results.length + ' 项）' : failed + ' 项失败', failed === 0 ? 'ok' : 'bad');
  })();
})();
</script>
</body>
</html>
